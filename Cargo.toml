[package]
name = "jobbot"
version = "0.1.0"
edition = "2021"
description = "Auto job discovery + apply bot (Resuma + ADK OpenRouter + Chrome CDP)"

[[bin]]
name = "jobbot"
path = "src/main.rs"

[dependencies]
# Prefer published/git Resuma. For a sibling checkout of GoldevLab/resuma, add
# .cargo/config.toml (gitignored) with:
#   [patch."https://github.com/GoldevLab/resuma"]
#   resuma = { path = "../resuma/crates/resuma" }
resuma = { git = "https://github.com/GoldevLab/resuma", package = "resuma" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "multipart"] }
scraper = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
futures = "0.3"
regex = "1"
chromiumoxide = "0.9"
adk-rust = { version = "1.0.0", default-features = false, features = ["openrouter", "agents", "models", "runner", "sessions"] }
adk-model = { version = "1.0.0", default-features = false, features = ["openrouter"] }
adk-core = "1.0.0"
